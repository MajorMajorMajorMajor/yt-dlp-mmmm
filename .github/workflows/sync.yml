name: Sync upstream + threads patch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref/tag to sync from (empty = latest upstream release tag)'
        required: false
        default: ''
        type: string
      update_release_branch:
        description: 'Push patched head to dist/main and trigger auto-release workflow'
        required: false
        default: true
        type: boolean
      upstream_release_channel:
        description: 'Upstream release channel when upstream_ref is empty'
        required: false
        default: 'nightly'
        type: choice
        options:
          - nightly
          - stable
      force_push:
        description: 'Force-push branches even if there are no changes'
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    if: ${{ vars.SYNC_ENABLED != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve inputs
        id: inputs
        env:
          INPUT_UPSTREAM_REF: ${{ github.event.inputs.upstream_ref }}
          INPUT_UPSTREAM_RELEASE_CHANNEL: ${{ github.event.inputs.upstream_release_channel }}
          INPUT_UPDATE_RELEASE_BRANCH: ${{ github.event.inputs.update_release_branch }}
          INPUT_FORCE_PUSH: ${{ github.event.inputs.force_push }}
        run: |
          upstream_release_channel="${INPUT_UPSTREAM_RELEASE_CHANNEL:-nightly}"
          update_release_branch="${INPUT_UPDATE_RELEASE_BRANCH:-true}"
          force_push="${INPUT_FORCE_PUSH:-false}"

          echo "upstream_ref=${INPUT_UPSTREAM_REF}" >> "$GITHUB_OUTPUT"
          echo "upstream_release_channel=${upstream_release_channel}" >> "$GITHUB_OUTPUT"
          echo "update_release_branch=${update_release_branch}" >> "$GITHUB_OUTPUT"
          echo "force_push=${force_push}" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream release target
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_REF: ${{ steps.inputs.outputs.upstream_ref }}
          INPUT_UPSTREAM_RELEASE_CHANNEL: ${{ steps.inputs.outputs.upstream_release_channel }}
          FORCE_PUSH: ${{ steps.inputs.outputs.force_push }}
        run: |
          set -euo pipefail

          upstream_channel="${INPUT_UPSTREAM_RELEASE_CHANNEL:-nightly}"

          if [[ -n "${INPUT_UPSTREAM_REF}" ]]; then
            upstream_ref="${INPUT_UPSTREAM_REF}"
            upstream_tag="${INPUT_UPSTREAM_REF}"
          else
            if [[ "${upstream_channel}" == "nightly" ]]; then
              upstream_tag="$(gh api repos/yt-dlp/yt-dlp-nightly-builds/releases/latest --jq .tag_name)"
              upstream_ref="$(gh api repos/yt-dlp/yt-dlp-nightly-builds/releases/latest --jq '.target_commitish // "master"')"
            else
              upstream_tag="$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name)"
              upstream_ref="${upstream_tag}"
            fi
          fi

          release_tag="${upstream_tag}-mmmm"
          should_release=true

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && [[ "${FORCE_PUSH}" != "true" ]]; then
            should_release=false
          fi

          echo "upstream_ref=${upstream_ref}" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "upstream_channel=${upstream_channel}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sync upstream and apply patch branches
        id: sync
        env:
          UPSTREAM_REF: ${{ steps.upstream.outputs.upstream_ref }}
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/yt-dlp/yt-dlp.git 2>/dev/null || true
          git fetch --no-tags upstream "${UPSTREAM_REF}"
          git fetch --no-tags origin src/threads src/automation dist/main || true

          upstream_sha="$(git rev-parse FETCH_HEAD)"
          git branch -f src/upstream "${upstream_sha}"

          git checkout -B dist-main-sync "${upstream_sha}"

          for source_branch in src/threads src/automation; do
            commits="$(git rev-list --reverse --no-merges "${upstream_sha}..origin/${source_branch}" || true)"
            if [[ -n "${commits}" ]]; then
              while read -r commit; do
                [[ -z "${commit}" ]] && continue
                git cherry-pick -x "${commit}"
              done <<< "${commits}"
            fi
          done

          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open sync conflict issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue_body=$(cat <<EOF
          Daily sync failed while cherry-picking patch branches.

          Upstream SHA: ${UPSTREAM_SHA:-unknown}
          Source branches: src/threads, src/automation
          Workflow run: ${RUN_URL}

          Resolve conflicts manually and rerun sync workflow.
          EOF
          )
          gh issue create \
            --title "Sync conflict applying patch branches at ${UPSTREAM_SHA:-unknown-sha}" \
            --body "${issue_body}" || true

      - name: Compare remote branch heads
        id: diff
        if: success()
        env:
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          RELEASE_SHA: ${{ steps.sync.outputs.release_sha }}
        run: |
          set -euo pipefail

          remote_upstream="$(git ls-remote --heads origin src/upstream | awk '{print $1}')"
          remote_release="$(git ls-remote --heads origin dist/main | awk '{print $1}')"

          [[ "${UPSTREAM_SHA}" != "${remote_upstream}" ]] && upstream_changed=true || upstream_changed=false
          [[ "${RELEASE_SHA}" != "${remote_release}" ]] && release_changed=true || release_changed=false

          echo "upstream_changed=${upstream_changed}" >> "$GITHUB_OUTPUT"
          echo "release_changed=${release_changed}" >> "$GITHUB_OUTPUT"

      - name: Push src/upstream
        if: success() && (steps.diff.outputs.upstream_changed == 'true' || steps.inputs.outputs.force_push == 'true')
        run: git push --force origin src/upstream:src/upstream

      - name: Push dist/main
        if: success() && vars.AUTO_RELEASE_ENABLED != 'false' && steps.inputs.outputs.update_release_branch == 'true' && (steps.diff.outputs.release_changed == 'true' || steps.inputs.outputs.force_push == 'true')
        run: git push --force origin HEAD:dist/main

      - name: Trigger auto-release workflow
        if: success() && vars.AUTO_RELEASE_ENABLED != 'false' && steps.inputs.outputs.update_release_branch == 'true' && steps.upstream.outputs.should_release == 'true' && (steps.diff.outputs.release_changed == 'true' || steps.inputs.outputs.force_push == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
          UPSTREAM_CHANNEL: ${{ steps.upstream.outputs.upstream_channel }}
        run: gh workflow run auto-release.yml --repo "${{ github.repository }}" --ref dist/main -f upstream_version="${UPSTREAM_TAG}" -f release_channel="${UPSTREAM_CHANNEL}"
