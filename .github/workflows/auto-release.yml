name: Release from release/main

on:
  push:
    branches:
      - release/main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (yyyy.mm.dd[.rev]). Leave empty for auto.'
        required: false
        default: ''
        type: string

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            base="$(date -u +%Y.%m.%d)"
            version="${base}"
            rev=1
            while git rev-parse -q --verify "refs/tags/${version}" >/dev/null || gh release view "${version}" >/dev/null 2>&1; do
              version="${base}.${rev}"
              rev=$((rev + 1))
            done
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: stable
      origin: ${{ github.repository }}
      linux_armv7l: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifact
          pattern: build-*
          merge-multiple: true

      - name: Verify required assets
        run: |
          set -euo pipefail
          test -f artifact/_update_spec
          test -f artifact/SHA2-256SUMS
          test -f artifact/yt-dlp

      - name: Recreate release tag if needed
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release delete "${VERSION}" --cleanup-tag --yes
          fi

      - name: Publish release
        run: |
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "yt-dlp ${VERSION}" \
            artifact/*

      - name: Verify latest release API and expected assets
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest" -o latest.json
          python - <<'PY'
          import json
          with open('latest.json', 'r', encoding='utf-8') as f:
              latest = json.load(f)
          names = {asset['name'] for asset in latest.get('assets', [])}
          required = {'_update_spec', 'SHA2-256SUMS', 'yt-dlp'}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Missing required assets: {', '.join(missing)}")
          print('Latest release and required assets verified')
          PY
