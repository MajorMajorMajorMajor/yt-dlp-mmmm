name: Release from dist/main

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Upstream release tag/version to mirror (without -mmmm suffix)'
        required: false
        default: ''
        type: string
      release_channel:
        description: 'Update channel embedded into built artifacts'
        required: false
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      version:
        description: 'Explicit release tag override (highest priority)'
        required: false
        default: ''
        type: string

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_version: ${{ steps.version.outputs.build_version }}
      release_channel: ${{ steps.version.outputs.release_channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_UPSTREAM_VERSION: ${{ github.event.inputs.upstream_version }}
          INPUT_RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          set -euo pipefail

          release_channel="${INPUT_RELEASE_CHANNEL:-nightly}"

          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
            source_version="${INPUT_VERSION}"
          else
            if [[ -n "${INPUT_UPSTREAM_VERSION}" ]]; then
              source_version="${INPUT_UPSTREAM_VERSION}"
            else
              if [[ "${release_channel}" == "nightly" ]]; then
                source_version="$(gh api repos/yt-dlp/yt-dlp-nightly-builds/releases/latest --jq .tag_name)"
              else
                source_version="$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name)"
              fi
            fi
            version="${source_version}-mmmm"
          fi

          if [[ "${source_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            build_version="${source_version}"
          else
            build_version="$(date -u +%Y.%m.%d.%H%M%S)"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_version=${build_version}" >> "$GITHUB_OUTPUT"
          echo "release_channel=${release_channel}" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.build_version }}
      channel: ${{ needs.prepare.outputs.release_channel }}
      origin: ${{ github.repository }}
      linux_armv7l: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifact
          pattern: build-*
          merge-multiple: true

      - name: Verify required assets
        run: |
          set -euo pipefail
          test -f artifact/_update_spec
          test -f artifact/SHA2-256SUMS
          test -f artifact/yt-dlp

      - name: Recreate release tag if needed
        run: |
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${VERSION}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          fi

      - name: Publish release
        run: |
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "yt-dlp ${VERSION}" \
            artifact/*

      - name: Verify latest release API and expected assets
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest" -o latest.json
          python - <<'PY'
          import json
          with open('latest.json', 'r', encoding='utf-8') as f:
              latest = json.load(f)
          names = {asset['name'] for asset in latest.get('assets', [])}
          required = {'_update_spec', 'SHA2-256SUMS', 'yt-dlp'}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Missing required assets: {', '.join(missing)}")
          print('Latest release and required assets verified')
          PY
